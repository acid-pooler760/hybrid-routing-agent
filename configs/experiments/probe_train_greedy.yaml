# probe_train_greedy.yaml
#
# Purpose: measure train-74 greedy pass@1 for any ckpt —— the first place zero-RL gains show up.
#   RL sharpens pass@k→pass@1, invisible on the temp=1.0 [TRAIN] curve; held-out sits behind
#   an extra layer of generalization. train-greedy is the most sensitive vital sign; ① if it does not move, held-out/overall are off the table.
#
# Recipe = the CLAUDE.md probe recipe (total_step=0 + step0_held_out_eval=true + policy_model
#   pointing at any ckpt dir) + held_out_meta pointing at train_v2_signal_v2 (74 tasks).
#   the held-out eval pipeline makes no special assumptions about the meta — it measures whatever it points at; num_rollout_per_trial=1 → pure greedy.
#
# How to run (once every 10 steps on the latest ckpt; 74 jobs ≈ 1 wave ≈ 30min):
#   1. point policy_model at the ckpt under test, e.g.:
#      runs/<your_run>/ckpt/epoch-N-policy/
#   2. nohup python osworld_rl.py config=configs/experiments/probe_train_greedy.yaml \
#         > logs/probe_train_greedy_stepN.log 2>&1 &
#   3. results land in runs/probe_train_greedy/results/held-out-eval.jsonl (domain level)
#      + trajs allow per-task lookup —— after each run, rename and archive the results to avoid overwrite:
#      mv runs/probe_train_greedy runs/archive/probe_train_greedy_stepN
#   Read-out: compare against the step-0 (base) probe; binomial σ for 74 task×1 greedy ≈ ±5.8pp,
#   a single point within ±5pp is noise; the direction across two consecutive probes + per-task flips (CLIMB) is more reliable.
# ⚠️ remember to run base once first (policy_model pointing at the original model) as the step-0 anchor.

defaults:
    - ../osworld_rl

model:
    policy_model: ${oc.env:MODEL_DIR,'./models'}/Qwen3-VL-8B-Thinking   # ← change to the path of the ckpt under test
    policy_model_type: "qwen3vl"
    reward_model: ${oc.env:MODEL_DIR,'./models'}/Qwen3-VL-8B-Thinking
    reward_model_type: "qwen3vl"
    environment_model: ${oc.env:MODEL_DIR,'./models'}/Qwen3-VL-8B-Thinking
    optimized_name: "optimized"
    optimized_reward_name: "optimized_reward"

experiment:
    project: "probe_train_greedy"
    total_step: 0                  # probe: no training
    eval_every: 99999
    held_out_every: 99999
    save_every: 99999
    start_from_scratch: true
    current_epoch: 1
    step0_held_out_eval: true      # ← probe body: step-0 already runs the set held_out_meta points to

rollout:
    action_space: "hybrid"
    observation_type: "screenshot"
    policy:
        num_trial: 12
        num_rollout_per_trial: 8
        max_steps: 50
        temperature: 1.0
        top_p: 1.0
        repetition_penalty: 1.0
        max_image_history_length: 4
    policy_evaluation:
        max_steps: 50
        temperature: 0.0
        max_image_history_length: 4
        num_rollout_per_trial: 1   # pure greedy pass@1
        num_trial: 0

hybrid:
    enabled: true
    mcp_enabled: true
    tool_retriever_top_k: 18
    tool_retriever_backend: "bm25"
    fallback_to_gui: true

reward:
    lambda_coef: 0.0
    eta_initial: 0.0
    eta_decay_steps: 30
    length_penalty_coef: 0.05
    max_steps_ref: 50
    step_fail_pen: 0.0
    repeat_pen: 0.0
    positive_advantage_only: false
    acc_lower: 0.05
    acc_upper: 0.95
    cap_penalty: 0.2
    terminate_bonus_efficient: 0.0
    terminate_bonus_slow:      0.0
    early_quit_pen:            0.0
    graceful_fail_bonus:       0.0
    false_success_pen:         0.0
    no_progress_pen:           0.0
    random_reward: false
    normalize_mode: groupwise

training:
    kl_reference: "old"
    beta: 0.02
    eps: 0.20
    entropy_coef: 0.0
    max_grad_norm: 1.0
    kl_warmup_steps:      0
    kl_warmup_multiplier: 1.0
    policy:
        update_per_step: 4
        max_gen_length: 8192

optimizer:
    name: adamw
    params:
        learning_rate: 5.0e-6
        scale_lr: False
        beta1: 0.9
        beta2: 0.999
        weight_decay: 0.0
        epsilon: 1e-8

dataset:
    train:
        environment_data_dir: "train_v2_signal_v2"
        domain: "all"
        example: "all"
    evaluation:
        environment_data_dir: "test_all_no_internet"
        domain: "all"
        example: "all"
    held_out_meta: "train_v2_signal_v2"   # ← probe target = train 74 (greedy pass@1)

wandb:
    entity: null
    project: "hybrid-routing-rl"

context_policy: "baseline"
