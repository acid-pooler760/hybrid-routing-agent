# probe_train_greedy_img2.yaml —— skip-img2 observation variant of probe_train_greedy
#
# Purpose: one of the context_rl dual probes. Measures train-74 greedy pass@1 for any ckpt,
#   with the observation policy exactly matching the context-RL training side (skip_on_mcp_success + img2).
#   run it and probe_train_greedy (img4) once each on the same ckpt → gap curve (main paper figure):
#   gap(step) = acc_img4(ckpt) − acc_img2(ckpt); expected to narrow over training while img4 holds.
#
# Usage (same as probe_train_greedy):
#   1. point policy_model at the ckpt under test (base anchor = original model path, run that first);
#   2. nohup python osworld_rl.py config=configs/experiments/probe_train_greedy_img2.yaml \
#         > logs/probe_img2_stepN.log 2>&1 &
#   3. always archive when done: mv runs/probe_train_greedy_img2 runs/archive/probe_img2_stepN
#   4. D14 subset read-out: per-task lookup from result.txt under rollouts/eval
#      (subset list: evaluation_examples/ctx_degraded_train14.json).
#
# Variants:
#   - decision points (step0/30/50): set num_rollout_per_trial to 3 → for the D14 difference-in-differences (DiD)
#     (14 task×3 σ≈±7pp; ×1 single points are too noisy — direction only);
#   - quick D20-only test: set held_out_meta to "ctx_degraded_d20" + num_rollout_per_trial 5
#     → 100 jobs ≈ 1 wave, focused on the degraded subset.
# ⚠️ single-point σ (74×1) ≈ ±5.8pp; judge trends by two consecutive directions + per-task flips.

defaults:
    - ../osworld_rl

model:
    policy_model: ${oc.env:MODEL_DIR,'./models'}/Qwen3-VL-8B-Thinking   # ← change to the path of the ckpt under test
    policy_model_type: "qwen3vl"
    reward_model: ${oc.env:MODEL_DIR,'./models'}/Qwen3-VL-8B-Thinking
    reward_model_type: "qwen3vl"
    environment_model: ${oc.env:MODEL_DIR,'./models'}/Qwen3-VL-8B-Thinking
    optimized_name: "optimized"
    optimized_reward_name: "optimized_reward"

experiment:
    project: "probe_train_greedy_img2"
    total_step: 0                  # probe: no training
    eval_every: 99999
    held_out_every: 99999
    save_every: 99999
    start_from_scratch: true
    current_epoch: 1
    step0_held_out_eval: true      # probe body: step-0 runs the set held_out_meta points to

rollout:
    action_space: "hybrid"
    observation_type: "screenshot"
    policy:
        num_trial: 12
        num_rollout_per_trial: 8
        max_steps: 50
        temperature: 1.0
        top_p: 1.0
        repetition_penalty: 1.0
        max_image_history_length: 2
    policy_evaluation:
        max_steps: 50
        temperature: 0.0
        max_image_history_length: 2   # ← matches the context-RL training observation
        num_rollout_per_trial: 1      # pure greedy; set to 3 at decision points
        num_trial: 0

hybrid:
    enabled: true
    mcp_enabled: true
    tool_retriever_top_k: 18
    tool_retriever_backend: "bm25"
    fallback_to_gui: true

reward:
    lambda_coef: 0.0
    eta_initial: 0.0
    eta_decay_steps: 30
    length_penalty_coef: 0.05
    max_steps_ref: 50
    step_fail_pen: 0.0
    repeat_pen: 0.0
    positive_advantage_only: false
    acc_lower: 0.05
    acc_upper: 0.95
    cap_penalty: 0.2
    terminate_bonus_efficient: 0.0
    terminate_bonus_slow:      0.0
    early_quit_pen:            0.0
    graceful_fail_bonus:       0.0
    false_success_pen:         0.0
    no_progress_pen:           0.0
    random_reward: false
    normalize_mode: groupwise

training:
    kl_reference: "old"
    beta: 0.02
    eps: 0.20
    entropy_coef: 0.0
    max_grad_norm: 1.0
    kl_warmup_steps:      0
    kl_warmup_multiplier: 1.0
    policy:
        update_per_step: 4
        max_gen_length: 8192

optimizer:
    name: adamw
    params:
        learning_rate: 5.0e-6
        scale_lr: False
        beta1: 0.9
        beta2: 0.999
        weight_decay: 0.0
        epsilon: 1e-8

dataset:
    train:
        environment_data_dir: "train_v2_signal_v2"
        domain: "all"
        example: "all"
    evaluation:
        environment_data_dir: "test_all_no_internet"
        domain: "all"
        example: "all"
    held_out_meta: "train_v2_signal_v2"   # probe target = train 74; switch to ctx_degraded_d20 for the quick D20 test

wandb:
    entity: null
    project: "hybrid-routing-rl"

context_policy: "skip_on_mcp_success"   # ← matches the context-RL training observation
